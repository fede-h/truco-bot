[package]
name = "truco_engine"
version = "0.1.0"
edition = "2021"
authors = ["truco-bot team"]
description = "High-performance compiled native shared-memory engine for Truco Argentine"

[lib]
name = "truco_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
atomic_float = "1.1"
rayon = "=1.10.0"
rand = { version = "0.8", features = ["small_rng"] }
memmap2 = "0.9"
pyo3 = { version = "0.22", optional = true }

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
rand = "0.8"

