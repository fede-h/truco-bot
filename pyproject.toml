[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/truco_engine/Cargo.toml"
module-name = "truco_engine"
features = ["pyo3/extension-module"]

[project]
name = "truco-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.16.1",
    "pettingzoo>=1.27.0",
    "pytest-bdd>=8.1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "ruff>=0.5",
]
eval = [
    "matplotlib>=3.8",
    "mlflow>=2.15",
    "pettingzoo>=1.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: throughput performance benchmarks",
]
filterwarnings = [
    "ignore::pytest.PytestRemovedIn10Warning",
]
